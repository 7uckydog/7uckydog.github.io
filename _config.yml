          - URL & QR 결제 기능 개발 (Canvas를 이용한 QR 이미지 생성)
          - 결제 확인 페이지 한/영 다국어 지원 및 실시간 유효시간 타이머 구현

          **PG 결제**
          - 결제창 웹 접근성 개선 (tabindex, aria-expanded 설정)
          - KMPI, NOTI 유지보수
          - Paypal 결제 취소 기능 개발 (Paypal API 연동)

          **KOVANPAY 홈페이지**
          - 홈페이지 테스트 결제 건 자동 취소 스케줄러 기능 개발
