about_content: | # this will include new lines to allow paragraphs
  **디자인을 전공한 감각적인 개발자 서유빈**입니다.

  Spring & Kotlin 기반의 **환전 및 현금 거래 관련** 백오피스 고도화 및 신규 서비스에 따른 기능 개발을 담당하고 있습니다.
  기존 백오피스에 신규 기능 및 성능 보완을 진행하며 리팩토링 진행에 거침없으며 
  키오스크 내 지속적인 신규 거래 유형이 추가됨에 따른 지속적 신규 개발에 익숙해져 있어, 빠른 환경 적응 및 플로우에 익숙해져 있습니다.

  시각디자인 전공를 전공함으로서 **UI/UX 감각**을 갖추고 있습니다.
  기획자, 디자이너와의 소통이 보다 유연하며 다양한 관점에서 기능을 살필수 있는 시야를 가지고 있습니다.

content:
  - title: Experience
    layout: list
    content:
      - layout: left
        title: "(주)더즌 "
        sub_title: "키오스크 개발팀 매니저"
        caption: "2024.07 ~ 현재"
        link: "https://www.dozn.co.kr"
        quote: >
          환건 및 현금성 거래 제공 — BackOffice | 홈페이지 고도화, 대시보드 개발
        description: |
          **환전 고도화 BackOffice**
          - 고도화 어드민, 고객사 어드민, 현금 수송 업체 어드민 백오피스 고도화 및 신규 기능 개발
            * 기존 내부 어드민의 기능을 고도화하여 신규 BO 런칭
              - 키오스크 실시간 시재 관리 및 금고 관리
              - 현금 수송 업체 BO와의 연동을 통한 실시간 현금 수송 작업 요청 및 수거, 장입 데이터 확인
              - 나이스 택스리펀드, eZL 교통카드 충전, 출금 거래 내역을 기반으로한 정산 & 대사 & 자동 송금
              - 엑셀 업/다운로드를 통한 은행 매입 / 매각 데이터 관리
              - UNIT 생성을 통한 키오스크 매핑 및 실시간 재고 관리
              - 스프레드, 여권 인증 이벤트, 프로모션, 키오스크, 홈페이지 데이터, 실시간 거래 데이터 관리
            * 현송 업체용 BO 런칭
              - 더즌 측의 현금 수송 요청 건 조회 및 작업 확정
              - 현금 수송 작업 완료 후 회수 & 장입 데이터 입력 및 확인 요청 (실시간 시재 validation 체크 진행)
              - 신규 현송 작업 요청 및 현송 잡업 데이터 입력 반려 건 메일 발송
            * 고객사 어드민 유지보수
          - 내부 어드민 유지보수 및 신규 기능 개발
            * 가맹점, 상점 정보 관리 기능 고도화
            * 고객 정보 조회 가능 거래 내역 기능 개발 (신규 거래 유형 추가 시 지속적인 신규 개발)
              
          **홈페이지 고도화 및 유지보수**
          - <a href="https://mx-dozn.co.kr/ko" target="_blank" style="background-color: #fefce8; padding: 2px 6px; border-radius: 3px;">홈페이지 UI 고도화하여 신규 홈페이지 런칭</a>
            * Claude를 이용한 바이브 코딩 진행
            * 기존 홈페이지 API의 version up을 통한 더프리 (더즌 환전 앱) API 제공
          - 이벤트 팝업 관리
          
          **대시보드 고도화 및 유지보수**
          - chart js를 이용한 실시간 일별 거래 현황
            * 거래별 일 거래 현황, 키오스크별 일 거래 현황, 국적별 거래 현황, 통화별 거래 현황 등
          - 거래별 고도화 대시보드 페이지 제공
          - 실시간 키오스크 상태 관리 및 조회 페이지 제공

