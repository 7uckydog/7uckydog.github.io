        title: "(주)더즌 "
        sub_title: "키오스크 개발팀 매니저"
        caption: "2024.07 ~ 현재"
        link: "https://www.dozn.co.kr"
        quote: >
          PG(결제대행) 전문 기업 — BackOffice 및 홈페이지 유지보수, 신규 개발
        description: |
          **PG BackOffice**
          - 관리자 / 가맹점 / 리셀러 백오피스 유지보수 및 기능 개선
          - 거래 내역 조회 슬로우 쿼리 개선 (불필요한 JOIN, 서브쿼리 최소화 / WHERE절 최적화)
          - BC(UPOP) / 카카오 거래 대사 기능 개발 (외부 API 연동 후 내부 DB 검증)
          - 더존 / 팝빌 세금계산서 인증서 및 담당자 조회 등록 기능 개발
          - 가맹점 환급 수수료 등록 및 조회 페이지 개발 (엑셀 업로드/다운로드, 홈페이지 연동)
          - 카카오 신용 매출 전표 UI 개선 (Iframe 활용)

          **CPS — 가맹점 모바일 주문 결제 시스템**
          - 카카오 알림톡 단일 / 그룹 결제 기능 개발
          - URL & QR 결제 기능 개발 (Canvas를 이용한 QR 이미지 생성)
          - 결제 확인 페이지 한/영 다국어 지원 및 실시간 유효기간 타이머 구현

          **PG 결제**
          - 결제창 웹 접근성 개선 (tabindex, aria-expanded 설정)
          - KMPI / NOTI 유지보수
          - Paypal 결제 취소 기능 개발 (HttpClient를 통한 Paypal API 연동)

          **KOVANPAY 홈페이지**
