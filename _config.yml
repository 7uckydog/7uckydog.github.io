about_content: | # this will include new lines to allow paragraphs
  **시각디자인을 전공한 센스있는 감각적인 개발자 서유빈**입니다.

  Spring & Kotlin 기반의 **환전 및 현금 거래 관련** 백오피스 고도화 및 신규 서비스에 따른 기능 개발을 담당하고 있습니다.
  기존 백오피스에 신규 기능 및 성능 보완을 진행하며 리팩토링 진행에 거침없으며 
  키오스크 내 지속적인 신규 거래 유형이 추가됨에 따른 지속적 신규 개발에 익숙해져 있어, 빠른 환경 적응 및 플로우에 익숙해져 있습니다.

  시각디자인 전공를 전공함으로서 **UI/UX 감각**을 갖추고 있습니다.
  기획자, 디자이너와의 소통이 보다 유연하며 다양한 관점에서 기능을 살필수 있는 시야를 가지고 있습니다.

